<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 400" width="1500" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3f2"/>
      <stop offset="0.5" stop-color="#e9e2ff"/>
      <stop offset="1" stop-color="#dff2ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h1hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bda7fb"/>
      <stop offset="1" stop-color="#8a67e8"/>
    </linearGradient>
    <linearGradient id="h1eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6fd8"/>
      <stop offset="0.55" stop-color="#3fc6d8"/>
      <stop offset="1" stop-color="#c9f2f6"/>
    </linearGradient>
    <linearGradient id="h1hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93f2d8"/>
      <stop offset="1" stop-color="#58d2ae"/>
    </linearGradient>
    <linearGradient id="h2hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc9e2"/>
      <stop offset="1" stop-color="#ff9dc9"/>
    </linearGradient>
    <linearGradient id="h2eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b34fd8"/>
      <stop offset="0.55" stop-color="#e07ff0"/>
      <stop offset="1" stop-color="#f6d9fb"/>
    </linearGradient>
    <path id="spark" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
    <path id="petal" d="M 0 0 C 8 -12 22 -14 30 -6 C 27 8 12 14 2 9 Z"/>
    <style>
      @keyframes drift { 0% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(10deg); } 100% { transform: translateY(0) rotate(0deg); } }
      @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .drift { animation: drift 6s ease-in-out infinite; transform-origin: center; }
      .drift2 { animation: drift 8s ease-in-out infinite; transform-origin: center; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1500" height="400" fill="url(#sky)"/>
  <circle cx="770" cy="180" r="190" fill="url(#glow)"/>
  <circle cx="120" cy="330" r="90" fill="#ffffff" opacity="0.35"/>
  <circle cx="1420" cy="80" r="70" fill="#ffffff" opacity="0.35"/>
  <circle cx="960" cy="330" r="46" fill="#ffffff" opacity="0.3"/>
  <circle cx="520" cy="60" r="34" fill="#ffffff" opacity="0.4"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.75">
    <g transform="translate(430 90)">
      <circle cx="0" cy="0" r="24"/><circle cx="30" cy="-14" r="30"/><circle cx="64" cy="-2" r="22"/>
      <rect x="-8" y="-4" width="84" height="26" rx="13"/>
    </g>
    <g transform="translate(1010 60) scale(0.8)">
      <circle cx="0" cy="0" r="24"/><circle cx="30" cy="-14" r="30"/><circle cx="64" cy="-2" r="22"/>
      <rect x="-8" y="-4" width="84" height="26" rx="13"/>
    </g>
  </g>

  <!-- petals -->
  <g class="drift"><use href="#petal" transform="translate(180 120) rotate(-20) scale(1.1)" fill="#ffc6dd"/></g>
  <g class="drift2"><use href="#petal" transform="translate(560 260) rotate(15) scale(0.9)" fill="#ffd7e8"/></g>
  <g class="drift"><use href="#petal" transform="translate(930 140) rotate(35) scale(1)" fill="#ffc6dd"/></g>
  <g class="drift2"><use href="#petal" transform="translate(1005 300) rotate(-10) scale(0.8)" fill="#ffd7e8"/></g>
  <g class="drift"><use href="#petal" transform="translate(660 80) rotate(60) scale(0.75)" fill="#ffe3f0"/></g>
  <g class="drift2"><use href="#petal" transform="translate(120 250) rotate(-40) scale(0.9)" fill="#ffd7e8"/></g>

  <!-- sparkles -->
  <use class="twinkle" href="#spark" transform="translate(640 190) scale(0.85)" fill="#fff1a8"/>
  <use class="twinkle" href="#spark" transform="translate(918 230) scale(1)" fill="#ffd1e8"/>
  <use class="twinkle" href="#spark" transform="translate(1120 70) scale(0.7)" fill="#bfe9ff"/>
  <use class="twinkle" href="#spark" transform="translate(210 60) scale(0.75)" fill="#d8ccff"/>
  <use class="twinkle" href="#spark" transform="translate(1420 300) scale(0.65)" fill="#ffd1e8"/>

  <!-- name -->
  <text x="770" y="205" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue','Chalkboard SE','Segoe UI',sans-serif" font-size="92" font-weight="bold" fill="#ffffff" stroke="#7a5cd6" stroke-width="9" paint-order="stroke" letter-spacing="3">wanazhar</text>
  <text x="770" y="258" text-anchor="middle" font-family="'Comic Sans MS','Comic Neue','Chalkboard SE','Segoe UI',sans-serif" font-size="26" fill="#8a67e8" letter-spacing="6">(｡•̀ᴗ-)✧ ようこそ ✧(◕‿◕)</text>

